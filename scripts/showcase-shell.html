<!doctype html>
<html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dealio · Vitrin</title>
<style>
@font-face{font-family:Inter;font-weight:100 900;src:url(assets/inter-latin.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:Inter;font-weight:100 900;src:url(assets/inter-latin-ext.woff2) format("woff2");unicode-range:U+0100-02AF,U+0304,U+0308,U+0329,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
:root{--chat:#313338;--box:#2b2d31;--box-border:#3f4147;--text:#dbdee1;--strong:#f2f3f5;--muted:#949ba4;--link:#00a8fc;--code:#1e1f22;--chip:rgba(78,80,88,.48)}
*{box-sizing:border-box}
body{margin:0;background:#1e1f22;color:var(--text);font:16px/1.375 Inter,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
body.capture{background:transparent}
header{max-width:1240px;margin:auto;padding:28px 24px 8px}
header small{color:#66c0f4;letter-spacing:.16em;font-size:11px;font-weight:700}
header h1{margin:6px 0;font-size:28px;letter-spacing:-.02em;color:var(--strong)}
header p{margin:0;color:#a8adb5;font-size:14px;max-width:760px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.toolbar button{padding:7px 12px;background:#2b2d31;border:1px solid #3f4147;border-radius:6px;color:#d8dbe1;font:inherit;font-size:14px;cursor:pointer}
.toolbar button[aria-pressed=true]{background:#264556;border-color:#66c0f4;color:#d3efff}
#shots{max-width:1240px;margin:0 auto;padding:16px 24px 48px;display:flex;flex-wrap:wrap;gap:32px;align-items:flex-start}
body.capture #shots{display:block;padding:24px;max-width:none}
body.capture #shots figure{margin:0 0 48px}
figure{margin:0}
figcaption{font-size:13px;color:var(--muted);margin:0 0 8px}
body.capture figcaption{display:none}

/* One Discord message, cropped to the chat background */
.shot{width:720px;background:var(--chat);border-radius:16px;padding:16px 48px 18px 72px;position:relative}
.mobile .shot{width:390px;padding:14px 14px 16px 64px}
.avatar{position:absolute;left:16px;top:18px;width:40px;height:40px;border-radius:50%}
.mobile .avatar{left:12px}
.meta{display:flex;align-items:center;gap:6px;height:22px;margin-bottom:4px}
.name{color:var(--strong);font-weight:600}
.app{background:#5865f2;color:#fff;font-size:10px;font-weight:700;line-height:15px;height:15px;padding:0 4px;border-radius:4px;display:inline-flex;align-items:center;gap:2px}
.app svg{width:10px;height:10px}
.time{color:var(--muted);font-size:12px;margin-left:2px}

/* Components V2 */
.container{background:var(--box);border:1px solid var(--box-border);border-radius:8px;padding:16px;display:flex;flex-direction:column;gap:8px;max-width:600px;position:relative;overflow:hidden}
.container.accent{border-left:0;padding-left:20px}
.container.accent::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--accent)}
.td{overflow-wrap:anywhere}
.td h1,.td h2,.td h3{color:var(--strong);margin:8px 0 0;line-height:1.375;font-weight:700}
.td h1{font-size:24px;letter-spacing:-.01em}.td h2{font-size:20px}.td h3{font-size:16px}
.td>:first-child{margin-top:0}
.td p{margin:0;min-height:1.375em}
.td small{display:block;font-size:12px;line-height:1.333;color:var(--muted);margin-top:2px}
.td blockquote{margin:2px 0;padding:0 0 0 12px;border-left:4px solid #4e5058;border-radius:4px}
.td ul{margin:2px 0;padding-left:20px}
.td a{color:var(--link);text-decoration:none}
.td strong{font-weight:700;color:var(--strong)}
.td del{color:inherit}
.td code{background:var(--code);border-radius:4px;padding:0 .2em;font:85%/1.4 Consolas,"Cascadia Mono",monospace}
.ts{background:var(--chip);border-radius:3px;padding:0 2px}
.sep{height:0}.sep.s1{margin:2px 0}.sep.s2{margin:10px 0}.sep.line{border-top:1px solid #3f4147}
.section{display:flex;gap:12px;align-items:flex-start}
.section>.body{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.section>.btn{align-self:center}
.thumb{width:85px;height:85px;object-fit:cover;border-radius:8px;flex:none;background:#1e1f22}
.mobile .thumb{width:64px;height:64px}
.gallery{display:grid;gap:4px;border-radius:8px;overflow:hidden}
.gallery.n2{grid-template-columns:1fr 1fr}
.gallery img{width:100%;display:block;aspect-ratio:460/215;object-fit:cover}
.row{display:flex;flex-wrap:wrap;gap:8px}
.btn{height:32px;min-width:52px;padding:2px 16px;border:0;border-radius:8px;color:#fff;font:500 14px/16px Inter,"Segoe UI",sans-serif;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;background:#4e5058}
.mobile .btn{padding:2px 12px}
.btn.s1{background:#5865f2}.btn.s3{background:#248046}.btn.s4{background:#da373c}
.btn[disabled]{opacity:.5}
.btn .ext{width:14px;height:14px;opacity:.9}
.btn img.emoji{width:18px;height:18px;margin:0}
.select{height:40px;width:100%;background:var(--code);border:1px solid var(--code);border-radius:8px;padding:0 12px;display:flex;align-items:center;gap:8px;color:var(--strong);font-size:15px}
.select .ph{color:var(--muted)}
.select span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.select svg{width:20px;height:20px;flex:none;color:var(--text)}
.select[aria-disabled=true]{opacity:.5}
img.emoji{width:1.375em;height:1.375em;vertical-align:-.3em;margin:0 .05em}
</style>
<body>
<header>
  <small>DEALIO / VİTRİN</small>
  <h1>Web sitesi için Discord görünümleri</h1>
  <p>Botun kendi bileşen kodundan üretilir; fiyatlar ve hesaplar örnektir. Discord'un kendi yazı tipi yerine Inter kullanılır. PNG'ler <code>npm run showcase</code> ile <code>.runtime/showcase/png</code> klasörüne 3x çözünürlükte çıkar.</p>
  <div class="toolbar" id="languages"></div>
  <div class="toolbar" id="widths"></div>
</header>
<main id="shots"></main>
<script id="data" type="application/json">DATA_PLACEHOLDER</script>
<script>
const data = JSON.parse(document.getElementById('data').textContent);
// The fixtures are captured at this moment, so relative timestamps read as they would then.
const now = Date.parse('2026-09-12T14:00:00.000Z');
const timeZone = 'Europe/Istanbul';
const labels = {
  notification: 'İndirim DM', home: 'Ana panel', wishlist: 'Wishlist', detail: 'Oyun detayı', summary: 'İlk özet DM',
  welcome: 'Karşılama', rhythm: 'Bildirim zamanı', history: 'Bildirim geçmişi', free: 'Ücretsiz oyun DM',
  test: 'Test DM', upcoming: 'Yakında çıkacaklar', setup: 'Kurulum onayı', region: 'Bölge seçici', settings: 'Ayarlar',
  supportPanel: 'Destek paneli', ticket: 'Destek ticket’ı', empty: 'Boş liste', blocked: 'DM engeli',
  partial: 'Eksik veri', hidden: 'Gizli wishlist', setupHidden: 'Kurulum: gizli wishlist', hiddenDm: 'Gizli wishlist DM', expired: 'Süresi dolmuş',
};
const todayAt = { tr: 'Bugün saat', en: 'Today at', de: 'Heute um', fr: 'Aujourd’hui à' };
const params = new URLSearchParams(location.search);
let language = params.get('lang') ?? 'tr';
let width = params.get('width') ?? 'desktop';
if (params.has('capture')) document.body.classList.add('capture');

function esc(x) { return String(x ?? '').replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;').replaceAll('"', '&quot;'); }
function stamp(seconds, style) {
  const ms = seconds * 1000;
  if (style === 'd') return new Intl.DateTimeFormat(language, { dateStyle: 'short', timeZone }).format(ms);
  const diff = (ms - now) / 1000;
  const units = [['year', 31536000], ['month', 2592000], ['day', 86400], ['hour', 3600], ['minute', 60], ['second', 1]];
  const [unit, size] = units.find(([, s]) => Math.abs(diff) >= s) ?? units.at(-1);
  return new Intl.RelativeTimeFormat(language, { numeric: 'auto' }).format(Math.round(diff / size), unit);
}
function inline(text) {
  const codes = [];
  let html = esc(text).replace(/`([^`]+)`/g, (_, c) => '\u0000' + (codes.push(c) - 1) + '\u0000');
  html = html
    .replace(/&lt;t:(\d+):([a-zA-Z])&gt;/g, (_, s, f) => '<span class="ts">' + esc(stamp(Number(s), f)) + '</span>')
    .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2">$1</a>')
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/__(.+?)__/g, '<u>$1</u>')
    .replace(/(^|[^*])\*([^*\s][^*]*?)\*/g, '$1<em>$2</em>')
    .replace(/~~(.+?)~~/g, '<del>$1</del>');
  return html.replace(/\u0000(\d+)\u0000/g, (_, i) => '<code>' + codes[i] + '</code>');
}
function markdown(text) {
  return text.split('\n').map((line) => {
    if (line.startsWith('-# ')) return '<small>' + inline(line.slice(3)) + '</small>';
    const heading = /^(#{1,3}) (.*)$/.exec(line);
    if (heading) return '<h' + heading[1].length + '>' + inline(heading[2]) + '</h' + heading[1].length + '>';
    if (line.startsWith('> ')) return '<blockquote>' + inline(line.slice(2)) + '</blockquote>';
    if (/^[-*] /.test(line)) return '<ul><li>' + inline(line.slice(2)) + '</li></ul>';
    return '<p>' + inline(line) + '</p>';
  }).join('');
}
const externalIcon = '<svg class="ext" viewBox="0 0 24 24" fill="currentColor"><path d="M15 2a1 1 0 0 0 0 2h3.59l-6.3 6.3a1 1 0 1 0 1.42 1.4L20 5.42V9a1 1 0 1 0 2 0V3a1 1 0 0 0-1-1h-6Z"/><path d="M5 4a3 3 0 0 0-3 3v12a3 3 0 0 0 3 3h12a3 3 0 0 0 3-3v-5a1 1 0 1 0-2 0v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5a1 1 0 0 0 0-2H5Z"/></svg>';
const chevron = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M5.3 9.3a1 1 0 0 1 1.4 0l5.3 5.29 5.3-5.3a1 1 0 1 1 1.4 1.42l-6 6a1 1 0 0 1-1.4 0l-6-6a1 1 0 0 1 0-1.42Z"/></svg>';
function render(c) {
  switch (c.type) {
    case 17: {
      const accent = c.accent_color == null ? '' : ' accent" style="--accent:#' + c.accent_color.toString(16).padStart(6, '0');
      return '<div class="container' + accent + '">' + c.components.map(render).join('') + '</div>';
    }
    case 10: return '<div class="td">' + markdown(c.content) + '</div>';
    case 14: return '<div class="sep s' + (c.spacing ?? 1) + (c.divider === false ? '' : ' line') + '"></div>';
    case 9: return '<div class="section"><div class="body">' + c.components.map(render).join('') + '</div>' + render(c.accessory) + '</div>';
    case 11: return '<img class="thumb" src="' + esc(c.media.url) + '" alt="' + esc(c.description) + '">';
    case 12: return '<div class="gallery n' + Math.min(c.items.length, 2) + '">' + c.items.map((i) => '<img src="' + esc(i.media.url) + '" alt="' + esc(i.description) + '">').join('') + '</div>';
    case 1: return '<div class="row">' + c.components.map(render).join('') + '</div>';
    case 2: return '<span class="btn s' + c.style + '"' + (c.disabled ? ' disabled' : '') + '>' + esc(c.emoji?.name ?? '') + (c.label ? '<span>' + esc(c.label) + '</span>' : '') + (c.style === 5 ? externalIcon : '') + '</span>';
    case 3: {
      const chosen = c.options?.filter((o) => o.default) ?? [];
      const text = chosen.length ? chosen.map((o) => (o.emoji?.name ? o.emoji.name + ' ' : '') + o.label).join(', ') : null;
      return '<div class="select"' + (c.disabled ? ' aria-disabled="true"' : '') + '><span' + (text ? '' : ' class="ph"') + '>' + esc(text ?? c.placeholder ?? '') + '</span>' + chevron + '</div>';
    }
    default: return '';
  }
}
// Discord draws emoji as Twemoji; Windows has no flag glyphs, so system emoji would not match.
const emojiPattern = /(?:\p{Regional_Indicator}{2}|[#*0-9]️?⃣|\p{Extended_Pictographic}(?:️|\p{Emoji_Modifier})?(?:‍\p{Extended_Pictographic}(?:️|\p{Emoji_Modifier})?)*)/gu;
function twemoji(root) {
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  const nodes = [];
  while (walker.nextNode()) if (emojiPattern.test(walker.currentNode.data)) nodes.push(walker.currentNode);
  for (const node of nodes) {
    const html = esc(node.data).replace(emojiPattern, (e) => {
      const points = [...e].map((ch) => ch.codePointAt(0).toString(16));
      const code = (e.includes('‍') ? points : points.filter((p) => p !== 'fe0f')).join('-');
      return '<img class="emoji" alt="' + e + '" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@15.1.0/assets/svg/' + code + '.svg">';
    });
    const span = document.createElement('span');
    span.innerHTML = html;
    node.replaceWith(...span.childNodes);
  }
}
function messageTime() {
  const time = new Intl.DateTimeFormat(language, { hour: 'numeric', minute: '2-digit', timeZone }).format(now);
  return todayAt[language] + ' ' + time;
}
const verified = '<svg viewBox="0 0 16 15"><path fill="currentColor" d="M7.4 11.17 4 8.62l1-1.36 2 1.53L10.64 4l1.36 1-4.6 6.17Z"/></svg>';
function show() {
  document.body.classList.toggle('mobile', width === 'mobile');
  document.documentElement.lang = language;
  const panels = data[language];
  const keys = [...Object.keys(labels).filter((k) => panels[k]), ...Object.keys(panels).filter((k) => !labels[k])];
  document.getElementById('shots').innerHTML = keys.map((key) =>
    '<figure><figcaption>' + esc(labels[key] ?? key) + ' · ' + key + '.png</figcaption>' +
    '<div class="shot" data-key="' + key + '"><img class="avatar" src="assets/dealio.png" alt="">' +
    '<div class="meta"><span class="name">Dealio</span><span class="app">' + verified + 'APP</span><span class="time">' + esc(messageTime()) + '</span></div>' +
    '<div style="display:flex;flex-direction:column;gap:8px">' + panels[key].map(render).join('') + '</div></div></figure>').join('');
  twemoji(document.getElementById('shots'));
  for (const b of document.querySelectorAll('.toolbar button')) b.setAttribute('aria-pressed', String(b.dataset.value === (b.dataset.kind === 'lang' ? language : width)));
}
function toolbar(id, kind, options) {
  for (const [value, label] of options) {
    const b = document.createElement('button');
    Object.assign(b.dataset, { kind, value });
    b.textContent = label;
    b.onclick = () => { if (kind === 'lang') language = value; else width = value; show(); };
    document.getElementById(id).appendChild(b);
  }
}
toolbar('languages', 'lang', [['tr', 'Türkçe'], ['en', 'English'], ['de', 'Deutsch'], ['fr', 'Français']]);
toolbar('widths', 'width', [['desktop', 'Masaüstü'], ['mobile', 'Telefon']]);
show();
// The capture script waits for this before measuring.
window.showcaseReady = Promise.all([document.fonts.ready, ...[...document.images].map((img) => img.decode().catch(() => {}))]);
</script>
</body></html>
