<main><article><h1>Opening the Steam app…</h1>
<p>If nothing happens, <a id="app" href="https://store.steampowered.com/">open the game in the Steam app</a> or <a id="web" href="https://store.steampowered.com/">view it on the Steam website</a>.</p>
<p lang="tr">Bir şey olmazsa <a id="app-tr" href="https://store.steampowered.com/">oyunu Steam uygulamasında aç</a> veya <a id="web-tr" href="https://store.steampowered.com/">Steam web sitesinde gör</a>.</p>
</article></main>
<script>(function(){var id=new URLSearchParams(location.search).get('app');if(!id||!/^[0-9]{1,10}$/.test(id))return;var app='steam://store/'+id,web='https://store.steampowered.com/app/'+id+'/';['app','app-tr'].forEach(function(k){document.getElementById(k).href=app;});['web','web-tr'].forEach(function(k){document.getElementById(k).href=web;});location.href=app;})();</script>
