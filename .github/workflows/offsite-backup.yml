name: Encrypted offsite backup
on:
  workflow_dispatch:
  schedule:
    - cron: '37 3 * * *'
permissions:
  contents: read
concurrency:
  group: offsite-backup
  cancel-in-progress: false
jobs:
  backup:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Pull encrypted SQLite snapshot with a restricted key
        env:
          BACKUP_SSH_KEY: ${{ secrets.BACKUP_SSH_KEY }}
          BACKUP_KNOWN_HOSTS: ${{ secrets.BACKUP_KNOWN_HOSTS }}
          BACKUP_SSH_TARGET: ${{ secrets.BACKUP_SSH_TARGET }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/dealio-ssh"
          printf '%s\n' "$BACKUP_SSH_KEY" > "$RUNNER_TEMP/dealio-ssh/key"
          printf '%s\n' "$BACKUP_KNOWN_HOSTS" > "$RUNNER_TEMP/dealio-ssh/known_hosts"
          timeout 150 ssh -T -i "$RUNNER_TEMP/dealio-ssh/key" -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/dealio-ssh/known_hosts" "$BACKUP_SSH_TARGET" > "$RUNNER_TEMP/wishlist.encrypted.json"
          test -s "$RUNNER_TEMP/wishlist.encrypted.json"
          test "$(stat -c %s "$RUNNER_TEMP/wishlist.encrypted.json")" -le 24117248
      # The source repository is public, so the ciphertext never becomes a workflow
      # artifact. It goes to a private repository, one branch per weekday; each
      # push replaces the copy from a week earlier.
      - name: Store the snapshot in the private backup repository
        env:
          BACKUP_REPO_SSH_KEY: ${{ secrets.BACKUP_REPO_SSH_KEY }}
          BACKUP_REPO_KNOWN_HOSTS: ${{ secrets.BACKUP_REPO_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' "$BACKUP_REPO_SSH_KEY" > "$RUNNER_TEMP/dealio-ssh/repo-key"
          printf '%s\n' "$BACKUP_REPO_KNOWN_HOSTS" > "$RUNNER_TEMP/dealio-ssh/repo-known-hosts"
          export GIT_SSH_COMMAND="ssh -F /dev/null -i $RUNNER_TEMP/dealio-ssh/repo-key -o IdentityAgent=none -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$RUNNER_TEMP/dealio-ssh/repo-known-hosts"
          slot="daily-$(date -u +%a | tr '[:upper:]' '[:lower:]')"
          git init -q -b "$slot" "$RUNNER_TEMP/backup-repo"
          cp "$RUNNER_TEMP/wishlist.encrypted.json" "$RUNNER_TEMP/backup-repo/wishlist.encrypted.json"
          cd "$RUNNER_TEMP/backup-repo"
          git add wishlist.encrypted.json
          git -c user.name='Dealio backup' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -q -m "Encrypted backup $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          timeout 120 git push -q --force git@github.com:byzephyron/dealio-backups.git "HEAD:refs/heads/$slot"
      - name: Confirm offsite storage to independent monitor
        env:
          BACKUP_PING_URL: ${{ secrets.HEALTHCHECKS_BACKUP_PING_URL }}
        run: curl --fail --silent --show-error --max-time 15 --retry 2 --output /dev/null "$BACKUP_PING_URL"
      - name: Report failure
        if: failure()
        env:
          BACKUP_PING_URL: ${{ secrets.HEALTHCHECKS_BACKUP_PING_URL }}
        run: curl --fail --silent --show-error --max-time 15 --output /dev/null "$BACKUP_PING_URL/fail"
      - name: Remove temporary files
        if: always()
        run: rm -rf "$RUNNER_TEMP/dealio-ssh" "$RUNNER_TEMP/wishlist.encrypted.json" "$RUNNER_TEMP/backup-repo"
