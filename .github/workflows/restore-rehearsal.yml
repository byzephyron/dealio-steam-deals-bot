name: Offsite restore rehearsal
on:
  workflow_dispatch:
  schedule:
    - cron: '47 5 1 * *'
permissions:
  contents: read
concurrency:
  group: restore-rehearsal
  cancel-in-progress: false
jobs:
  restore:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
      - name: Fetch the most recent encrypted backup
        env:
          BACKUP_REPO_SSH_KEY: ${{ secrets.BACKUP_REPO_SSH_KEY }}
          BACKUP_REPO_KNOWN_HOSTS: ${{ secrets.BACKUP_REPO_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/dealio-ssh" "$RUNNER_TEMP/recovery"
          printf '%s\n' "$BACKUP_REPO_SSH_KEY" > "$RUNNER_TEMP/dealio-ssh/repo-key"
          printf '%s\n' "$BACKUP_REPO_KNOWN_HOSTS" > "$RUNNER_TEMP/dealio-ssh/repo-known-hosts"
          export GIT_SSH_COMMAND="ssh -F /dev/null -i $RUNNER_TEMP/dealio-ssh/repo-key -o IdentityAgent=none -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$RUNNER_TEMP/dealio-ssh/repo-known-hosts"
          git init -q "$RUNNER_TEMP/backup-repo"
          cd "$RUNNER_TEMP/backup-repo"
          timeout 120 git fetch -q --depth 1 git@github.com:byzephyron/dealio-backups.git '+refs/heads/daily-*:refs/remotes/backup/daily-*'
          latest=$(git for-each-ref --sort=-committerdate --count=1 --format='%(refname)' refs/remotes/backup/)
          test -n "$latest"
          git show "$latest:wishlist.encrypted.json" > "$RUNNER_TEMP/recovery/wishlist.encrypted.json"
          test -s "$RUNNER_TEMP/recovery/wishlist.encrypted.json"
      # No dependency install scripts in the job that later holds the private key.
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Decrypt, verify integrity and migrate an isolated copy
        env:
          DEALIO_BACKUP_PRIVATE_KEY: ${{ secrets.DEALIO_BACKUP_PRIVATE_KEY }}
        run: node scripts/restore-encrypted-backup.mjs "$RUNNER_TEMP/recovery/wishlist.encrypted.json" > "$RUNNER_TEMP/restore-evidence.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: restore-evidence
          path: ${{ runner.temp }}/restore-evidence.json
          retention-days: 35
          if-no-files-found: error
      - name: Confirm successful recovery
        env:
          RESTORE_PING_URL: ${{ secrets.HEALTHCHECKS_RESTORE_PING_URL }}
        run: curl --fail --silent --show-error --max-time 15 --retry 2 --output /dev/null "$RESTORE_PING_URL"
      - name: Report failure
        if: failure()
        env:
          RESTORE_PING_URL: ${{ secrets.HEALTHCHECKS_RESTORE_PING_URL }}
        run: curl --fail --silent --show-error --max-time 15 --output /dev/null "$RESTORE_PING_URL/fail"
      - name: Remove temporary files
        if: always()
        run: rm -rf "$RUNNER_TEMP/dealio-ssh" "$RUNNER_TEMP/backup-repo" "$RUNNER_TEMP/recovery"
