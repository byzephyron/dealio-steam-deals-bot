name: Publish public Dealio pages
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: public-site
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
      - run: node scripts/build-public-site.mjs
      - name: Publish allowlisted assets to the separate public repository
        env:
          PUBLIC_PAGES_SSH_KEY: ${{ secrets.PUBLIC_PAGES_SSH_KEY }}
          PUBLIC_PAGES_KNOWN_HOSTS: ${{ secrets.PUBLIC_PAGES_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' "$PUBLIC_PAGES_SSH_KEY" > "$RUNNER_TEMP/pages-key"
          printf '%s\n' "$PUBLIC_PAGES_KNOWN_HOSTS" > "$RUNNER_TEMP/pages-known-hosts"
          export GIT_SSH_COMMAND="ssh -F /dev/null -i $RUNNER_TEMP/pages-key -o IdentityAgent=none -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$RUNNER_TEMP/pages-known-hosts"
          git clone --depth 1 git@github.com:byzephyron/dealio-public-pages.git "$RUNNER_TEMP/public-pages"
          cp .runtime/public-site/* "$RUNNER_TEMP/public-pages/"
          touch "$RUNNER_TEMP/public-pages/.nojekyll"
          cd "$RUNNER_TEMP/public-pages"
          git add -- index.html index-en.html index-tr.html help.html help-tr.html privacy.html privacy-tr.html terms.html terms-tr.html styles.css staticwebapp.config.json open.html archivo-latin.woff2 archivo-latin-ext.woff2 dealio-icon.webp alert-en.webp alert-tr.webp alerts-panel-en.webp alerts-panel-tr.webp index-de.html help-de.html privacy-de.html terms-de.html index-fr.html help-fr.html privacy-fr.html terms-fr.html alert-de.webp alert-fr.webp alerts-panel-de.webp alerts-panel-fr.webp .nojekyll
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='Dealio pages publisher' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "Publish approved public pages"
          git push origin HEAD:main
      - name: Remove publisher key
        if: always()
        run: rm -f "$RUNNER_TEMP/pages-key"
